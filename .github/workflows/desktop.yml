name: Apply and verify desktop SVG compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/patches/svg-logo-compat.patch"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
          fetch-depth: 0
      - name: Apply SVG compatibility patch
        run: |
          git apply --check .github/patches/svg-logo-compat.patch
          git apply .github/patches/svg-logo-compat.patch
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"
      - name: Verify SVG compatibility paths
        run: python -m pytest python-tests/cover/test_publisher_logo_render.py desktop/tests/test_svg_logo.py -q
      - name: Run all shared tests
        run: python -m pytest python-tests -q
      - name: Test publisher metadata and logo desktop UI
        run: python -m pytest desktop/tests/test_publisher_metadata_panel.py desktop/tests/test_publisher_logo_dialog.py desktop/tests/test_publisher_logo_embedding.py -q
      - name: Test converter crop controls
        run: python -m pytest desktop/tests/test_converter_crop_controls.py -q
      - name: Test shared-geometry layout preview
        run: python -m pytest desktop/tests/test_layout_preview.py -q
      - name: Capture remaining desktop regression results
        shell: bash
        run: |
          set +e
          python -m pytest desktop/tests -q --tb=short --junitxml=remaining-desktop.xml \
            --ignore=desktop/tests/test_svg_logo.py \
            --ignore=desktop/tests/test_publisher_metadata_panel.py \
            --ignore=desktop/tests/test_publisher_logo_dialog.py \
            --ignore=desktop/tests/test_publisher_logo_embedding.py \
            --ignore=desktop/tests/test_converter_crop_controls.py \
            --ignore=desktop/tests/test_layout_preview.py \
            > remaining-desktop.log 2>&1
          code=$?
          echo "$code" > remaining-desktop.exit
          cat remaining-desktop.log
          exit 0
      - name: Upload remaining desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-desktop-diagnostics
          path: |
            remaining-desktop.log
            remaining-desktop.xml
            remaining-desktop.exit
          if-no-files-found: error
      - name: Require remaining desktop tests
        shell: bash
        run: test "$(cat remaining-desktop.exit)" = "0"
      - name: Compile and verify structure
        run: |
          python -m compileall -q python/src app/src/main/python
          python scripts/verify_project.py
      - name: Commit verified implementation and restore normal CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/desktop.yml > .github/workflows/desktop.yml
          git rm .github/patches/svg-logo-compat.patch
          git rm .github/workflows/apply-svg-logo-compat.yml
          git add -A
          git commit -m "fix: make publisher SVG logos cross-platform"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
