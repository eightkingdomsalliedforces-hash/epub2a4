name: Apply and verify desktop compatibility fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/patches/svg-logo-compat.patch"
      - ".github/patches/desktop-regression-fixes.patch"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
          fetch-depth: 0
      - name: Apply SVG compatibility patch
        run: |
          git apply --check .github/patches/svg-logo-compat.patch
          git apply .github/patches/svg-logo-compat.patch
      - name: Apply deterministic desktop compatibility edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("python/src/epub_a4_word_desktop/cover/controller.py"): (
                  '        if active_template == "publisher_back_matter":\n',
                  '        if active_template in {\n'
                  '            "publisher_back_matter",\n'
                  '            "publisher_back_matter_with_spine",\n'
                  '        }:\n',
              ),
              Path("python/src/epub_a4_word_desktop/cover/setup_panel.py"): (
                  '            "publisher_back_matter_with_spine",\n'
                  '        )\n'
                  '        self.create_button = QPushButton',
                  '            "publisher_back_matter",\n'
                  '        )\n'
                  '        self.create_button = QPushButton',
              ),
              Path("python/src/epub_a4_word_desktop/cover/canvas.py"): (
                  '        scene = self.scene()\n'
                  '        scene.clear()\n'
                  '        self.items_by_id.clear()\n'
                  '        self.group_members_by_element.clear()\n',
                  '        scene = self.scene()\n'
                  '        self._syncing_group_selection = True\n'
                  '        try:\n'
                  '            self.items_by_id.clear()\n'
                  '            self.group_members_by_element.clear()\n'
                  '            scene.clear()\n'
                  '        finally:\n'
                  '            self._syncing_group_selection = False\n',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"
      - name: Verify focused publisher, SVG, crop, and preview paths
        run: >-
          python -m pytest
          python-tests/cover/test_publisher_logo_render.py
          desktop/tests/test_svg_logo.py
          desktop/tests/test_publisher_metadata_panel.py
          desktop/tests/test_publisher_logo_dialog.py
          desktop/tests/test_publisher_logo_embedding.py
          desktop/tests/test_converter_crop_controls.py
          desktop/tests/test_layout_preview.py
          desktop/tests/test_publisher_workflow.py
          desktop/tests/test_user_reported_cover_regressions.py
          desktop/tests/test_cover_canvas.py
          -q
      - name: Run all shared tests
        run: python -m pytest python-tests -q
      - name: Run all desktop tests
        run: python -m pytest desktop/tests -q
      - name: Compile and verify structure
        run: |
          python -m compileall -q python/src app/src/main/python
          python scripts/verify_project.py
      - name: Commit verified implementation and restore normal CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 159d02747e4c6b45878db046b94ee6800eed848f:.github/workflows/desktop.yml > .github/workflows/desktop.yml
          git rm .github/patches/svg-logo-compat.patch
          git rm .github/patches/desktop-regression-fixes.patch
          git rm .github/workflows/apply-svg-logo-compat.yml
          git add -A
          git commit -m "fix: complete desktop publisher template and crop guides"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
