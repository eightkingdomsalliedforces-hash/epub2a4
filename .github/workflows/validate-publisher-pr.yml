name: Validate publisher feature

on:
  push:
    branches:
      - agent/publisher-back-isbn-image-transform
    paths:
      - ".github/workflows/validate-publisher-pr.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/publisher-back-isbn-image-transform
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install --yes libegl1
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install -e ".[test]"
            python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"
          } 2>&1 | tee /tmp/install.log

      - name: Run all shared Python tests
        id: core
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest python-tests -q --junitxml=core-test-results.xml 2>&1 | tee /tmp/core.log

      - name: Run all desktop tests
        id: desktop
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest desktop/tests -q --junitxml=desktop-test-results.xml 2>&1 | tee /tmp/desktop.log

      - name: Run desktop offscreen smoke
        id: smoke
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/desktop_smoke.py --offscreen 2>&1 | tee /tmp/smoke.log

      - name: Compile and verify project structure
        id: structure
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q python/src app/src/main/python
            python scripts/verify_project.py
          } 2>&1 | tee /tmp/structure.log

      - name: Persist validation report and remove one-shot workflow
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
        run: |
          set -euo pipefail
          mkdir -p docs/verification
          {
            echo "# Publisher feature validation"
            echo
            echo "Validated on GitHub Actions using Ubuntu and Python 3.13."
            echo
            echo "- Dependency installation: ${INSTALL_OUTCOME}"
            echo "- Shared Python tests: ${CORE_OUTCOME:-skipped}"
            echo "- Desktop tests: ${DESKTOP_OUTCOME:-skipped}"
            echo "- Desktop offscreen smoke: ${SMOKE_OUTCOME:-skipped}"
            echo "- Compile and structure verification: ${STRUCTURE_OUTCOME:-skipped}"
            echo
            echo "Source commit: ${GITHUB_SHA}."
            for name in install core desktop smoke structure; do
              log="/tmp/${name}.log"
              if [ -f "$log" ]; then
                echo
                echo "## ${name} output"
                echo
                echo '```text'
                tail -n 120 "$log"
                echo '```'
              fi
            done
          } > docs/verification/2026-07-26-publisher-feature-validation.md
          rm -f .github/workflows/validate-publisher-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: record publisher feature validation"
          git pull --rebase origin agent/publisher-back-isbn-image-transform
          git push origin HEAD:agent/publisher-back-isbn-image-transform
