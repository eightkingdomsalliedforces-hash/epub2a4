name: Apply desktop publisher implementation

on:
  push:
    branches:
      - fix/reference-back-cover-isbn-clarity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Decode and verify implementation patch
        shell: bash
        run: |
          cat .github/patch-chunks/part* | base64 --decode | gzip --decompress > /tmp/desktop-publisher.patch
          git apply --check /tmp/desktop-publisher.patch
      - name: Apply implementation and remove temporary files
        shell: bash
        run: |
          git apply --index /tmp/desktop-publisher.patch
          git rm -r .github/patch-chunks
          git rm .github/workflows/apply-desktop-publisher-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add desktop publisher spine logos and crop guides"
          git push origin "HEAD:${GITHUB_REF_NAME}"
