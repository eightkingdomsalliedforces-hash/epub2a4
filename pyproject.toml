[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-a4-word"
version = "0.6.2"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4==4.13.4",
  "lxml==5.3.0",
  "Pillow==11.0.0",
  "python-docx==1.1.2",
  "pypdf==6.14.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
]
desktop = [
  "PySide6==6.11.1",
  "keyring==25.7.0",
  "platformdirs==4.10.1",
]
portable = [
  "PyInstaller>=6.14,<7",
]

[project.scripts]
epub2a4-desktop = "epub_a4_word_desktop.__main__:main"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.pytest.ini_options]
testpaths = ["python-tests", "desktop/tests"]
pythonpath = ["python/src", "app/src/main/python"]
