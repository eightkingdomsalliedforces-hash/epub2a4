name: Focused cover search and B6 tests

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/focused-plan-tests.yml"
      - "python/src/epub_a4_word/**"
      - "python/src/epub_a4_word_desktop/conversion/**"
      - "python/src/epub_a4_word_desktop/pages/converter_page.py"
      - "python-tests/test_b6_on_a5_*.py"
      - "python-tests/cover/search/**"
      - "python-tests/fixtures/search/**"
      - "desktop/tests/test_b6_converter_page.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test,desktop]"

      - name: Test B6 mode contract
        run: python -m pytest python-tests/test_b6_on_a5_mode.py -q

      - name: Test B6 geometry
        run: python -m pytest python-tests/test_b6_on_a5_geometry.py -q

      - name: Test B6 DOCX output
        run: python -m pytest python-tests/test_b6_on_a5_docx.py -q

      - name: Test B6 converter UI
        run: python -m pytest desktop/tests/test_b6_converter_page.py -q

      - name: Test cover search contracts
        run: python -m pytest python-tests/cover/search/test_contracts.py -q

      - name: Test public book search
        run: python -m pytest python-tests/cover/search/test_public_search.py -q
