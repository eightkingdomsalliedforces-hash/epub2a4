name: Apply cover item rendering fixes

on:
  push:
    branches:
      - fix/reference-back-cover-isbn-clarity
    paths:
      - .github/workflows/apply-cover-item-rendering.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
      - name: Patch graphics items
        shell: python
        run: |
          import base64
          from pathlib import Path

          helper_b64 = ""
          bounds_b64 = ""
          tail_b64 = ""

          path = Path("python/src/epub_a4_word_desktop/cover/items.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          gui_import = lines.index(
              "from PySide6.QtGui import QColor, QFont, QPainter, QPen, QPixmap"
          )
          lines[gui_import] = (
              "from PySide6.QtGui import QColor, QFont, QFontDatabase, QPainter, QPen, QPixmap"
          )

          isbn_start = lines.index("from epub_a4_word.cover.isbn import (")
          isbn_end = lines.index(")", isbn_start)
          lines[isbn_start : isbn_end + 1] = [
              "from epub_a4_word.cover.barcode_layout import BarcodeTextAnchor, build_barcode_layout",
              "from epub_a4_word.cover.isbn import canonical_isbn13",
              "from epub_a4_word.cover.models import CoverElement",
              "from epub_a4_word.cover.typography import font_candidates, points_to_mm",
          ]
          duplicate_model = lines.index(
              "from epub_a4_word.cover.models import CoverElement", isbn_start + 4
          )
          del lines[duplicate_model]

          class_index = lines.index("class CoverElementItem(QGraphicsObject):")
          helper = base64.b64decode(helper_b64).decode("utf-8").splitlines()
          lines[class_index:class_index] = helper

          bounds_index = lines.index("    def boundingRect(self) -> QRectF:")
          bounds = base64.b64decode(bounds_b64).decode("utf-8").splitlines()
          lines[bounds_index : bounds_index + 2] = bounds

          lines = [
              line.replace("rect = self.boundingRect()", "rect = self.contentRect()")
              .replace("target = self.boundingRect()", "target = self.contentRect()")
              .replace("self.boundingRect(),", "self.contentRect(),")
              for line in lines
          ]

          barcode_index = lines.index("class CoverBarcodeItem(CoverElementItem):")
          tail = base64.b64decode(tail_b64).decode("utf-8").splitlines()
          lines[barcode_index:] = tail
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/src/epub_a4_word_desktop/cover/items.py
          git commit -m "fix: repaint controls and scale cover fonts correctly"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
