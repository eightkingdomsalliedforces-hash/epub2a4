name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "python-tests/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify Python core
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest beautifulsoup4==4.13.4 lxml==5.3.0 Pillow==11.0.0 python-docx==1.1.2
          PYTHONPATH=app/src/main/python python -m pytest python-tests -q
          PYTHONPATH=app/src/main/python python -m compileall -q app/src/main/python
          python scripts/verify_project.py

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build tests and debug APK
        env:
          CHAQUOPY_PYTHON: python3.13
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Verify 16 KB APK alignment
        run: |
          ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Word-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
