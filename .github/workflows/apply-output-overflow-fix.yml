name: Apply output overflow implementation

on:
  push:
    branches:
      - agent/impl-output-overflow-alias-cover-export
    paths:
      - ".upload/output-fix.patch.xz.b64"
      - ".upload/ready.sha256"
      - ".github/workflows/apply-output-overflow-fix.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".upload/output-fix.patch.xz.b64"
      - ".upload/ready.sha256"
      - ".github/workflows/apply-output-overflow-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply verified implementation patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .upload/output-fix.patch.xz.b64 || ! -f .upload/ready.sha256 ]]; then
            echo "Patch is not complete yet; nothing to apply."
            exit 0
          fi
          expected="$(tr -d '[:space:]' < .upload/ready.sha256)"
          base64 --decode .upload/output-fix.patch.xz.b64 > /tmp/output-fix.patch.xz
          actual="$(sha256sum /tmp/output-fix.patch.xz | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          xz --decompress --stdout /tmp/output-fix.patch.xz > /tmp/output-fix.patch
          git apply --check /tmp/output-fix.patch
          git apply /tmp/output-fix.patch
          rm -rf .upload
          rm -f .github/workflows/apply-output-overflow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent overflow and simplify cover export"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${branch}"
