name: Apply and verify desktop compatibility fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/patches/svg-logo-compat.patch"
      - ".github/patches/desktop-regression-fixes.patch"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
          fetch-depth: 0
      - name: Apply SVG compatibility patch
        run: |
          git apply --check .github/patches/svg-logo-compat.patch
          git apply .github/patches/svg-logo-compat.patch
      - name: Apply deterministic desktop compatibility edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller_path = Path("python/src/epub_a4_word_desktop/cover/controller.py")
          controller = controller_path.read_text(encoding="utf-8")
          old_controller = '''        project = self._require_project()
          candidate = replace(project, metadata=replace(project.metadata, isbn=isbn))
          active_template = str(candidate.background.get("active_template", ""))
          if active_template == "publisher_back_matter":
              generated_project = apply_cover_template(candidate, active_template)
              generated = generated_project.elements_by_id
              sync_ids = ("back-isbn-label", "back-isbn-code")
              existing_ids = {element.id for element in candidate.elements}
              updated: list[CoverElement] = []
              for element in candidate.elements:
                  generated_element = generated.get(element.id)
                  if element.id in sync_ids and generated_element is not None:
                      updated.append(
                          replace(
                              element,
                              kind=generated_element.kind,
                              region=generated_element.region,
                              content=dict(generated_element.content),
                          )
                      )
                  else:
                      updated.append(element)
              for element_id in sync_ids:
                  if element_id not in existing_ids and element_id in generated:
                      updated.append(generated[element_id])
              candidate = replace(
                  candidate,
                  background=generated_project.background,
                  elements=tuple(updated),
              )
          else:
              updated = []
              for element in candidate.elements:
                  content = dict(element.content)
                  if element.kind is ElementKind.BARCODE_PLACEHOLDER:
                      content["isbn"] = isbn
                      content["text"] = isbn
                  elif element.id == "back-isbn-label":
                      content["text"] = f"ISBN {isbn}"
                  updated.append(replace(element, content=content))
              candidate = replace(candidate, elements=tuple(updated))
          self.replace_project(dumps_project(candidate), label="套用 ISBN")
'''
          new_controller = '''        project = self._require_project()
          metadata = replace(project.metadata, isbn=isbn)
          active_template = str(project.background.get("active_template", ""))
          if active_template in {
              "publisher_back_matter",
              "publisher_back_matter_with_spine",
          }:
              candidate = refresh_template_metadata(project, metadata)
          else:
              candidate = replace(project, metadata=metadata)
              updated = []
              for element in candidate.elements:
                  content = dict(element.content)
                  if element.kind is ElementKind.BARCODE_PLACEHOLDER:
                      content["isbn"] = isbn
                      content["text"] = isbn
                  elif element.id == "back-isbn-label":
                      content["text"] = f"ISBN {isbn}"
                  updated.append(replace(element, content=content))
              candidate = replace(candidate, elements=tuple(updated))
          self.replace_project(dumps_project(candidate), label="套用 ISBN")
'''
          if controller.count(old_controller) != 1:
              raise SystemExit("controller apply_isbn replacement target was not unique")
          controller_path.write_text(
              controller.replace(old_controller, new_controller, 1),
              encoding="utf-8",
          )

          replacements = {
              Path("python/src/epub_a4_word_desktop/cover/setup_panel.py"): (
                  '            "publisher_back_matter_with_spine",\n'
                  '        )\n'
                  '        self.create_button = QPushButton',
                  '            "publisher_back_matter",\n'
                  '        )\n'
                  '        self.create_button = QPushButton',
              ),
              Path("python/src/epub_a4_word_desktop/cover/canvas.py"): (
                  '        scene = self.scene()\n'
                  '        scene.clear()\n'
                  '        self.items_by_id.clear()\n'
                  '        self.group_members_by_element.clear()\n',
                  '        scene = self.scene()\n'
                  '        self._syncing_group_selection = True\n'
                  '        try:\n'
                  '            self.items_by_id.clear()\n'
                  '            self.group_members_by_element.clear()\n'
                  '            scene.clear()\n'
                  '        finally:\n'
                  '            self._syncing_group_selection = False\n',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"
      - name: Verify SVG and new desktop feature paths
        run: >-
          python -m pytest
          python-tests/cover/test_publisher_logo_render.py
          desktop/tests/test_svg_logo.py
          desktop/tests/test_publisher_metadata_panel.py
          desktop/tests/test_publisher_logo_dialog.py
          desktop/tests/test_publisher_logo_embedding.py
          desktop/tests/test_converter_crop_controls.py
          desktop/tests/test_layout_preview.py
          -q
      - name: Verify publisher ISBN workflow compatibility
        run: python -m pytest desktop/tests/test_publisher_workflow.py -q --tb=short
      - name: Verify legacy template option compatibility
        run: python -m pytest desktop/tests/test_user_reported_cover_regressions.py -q --tb=short
      - name: Verify canvas reload lifetime
        run: python -m pytest desktop/tests/test_cover_canvas.py -q --tb=short
      - name: Run all shared tests
        run: python -m pytest python-tests -q
      - name: Run all desktop tests
        run: python -m pytest desktop/tests -q
      - name: Compile and verify structure
        run: |
          python -m compileall -q python/src app/src/main/python
          python scripts/verify_project.py
      - name: Commit verified implementation and restore normal CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 159d02747e4c6b45878db046b94ee6800eed848f:.github/workflows/desktop.yml > .github/workflows/desktop.yml
          git rm .github/patches/svg-logo-compat.patch
          git rm .github/patches/desktop-regression-fixes.patch
          git rm .github/workflows/apply-svg-logo-compat.yml
          git add -A
          git commit -m "fix: complete desktop publisher template and crop guides"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
