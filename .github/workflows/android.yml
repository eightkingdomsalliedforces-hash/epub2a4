name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/cross-platform-cover-tool
    paths:
      - "app/**"
      - "python/**"
      - "python-tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "python/**"
      - "python-tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Kotlin unit tests first
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and verify Python core
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install "pytest>=8.3,<9"
          python -c "import pypdf, epub_a4_word; print('pypdf', pypdf.__version__); print('epub_a4_word', epub_a4_word.__version__)"
          python -m pytest python-tests -q
          python -m compileall -q python/src app/src/main/python
          python scripts/verify_project.py

      - name: Compile Android tests and build debug APK
        env:
          CHAQUOPY_PYTHON: python3.13
        run: gradle --no-daemon compileDebugAndroidTestKotlin assembleDebug --stacktrace

      - name: Verify 16 KB APK alignment
        run: |
          ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Word-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
