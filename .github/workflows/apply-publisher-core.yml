name: Apply publisher core implementation

on:
  push:
    branches:
      - agent/publisher-back-isbn-image-transform
    paths:
      - ".github/implementation/publisher-core-*.b64"
      - ".github/workflows/apply-publisher-core.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: python/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publisher-back-isbn-image-transform
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Reassemble and apply source patch
        shell: bash
        run: |
          cat .github/implementation/publisher-core-*.b64 | base64 --decode > scripts/apply_publisher_core.py
          python scripts/apply_publisher_core.py

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run focused core tests
        run: >-
          python -m pytest -q
          python-tests/cover/test_isbn.py
          python-tests/cover/test_publisher_back_template.py
          python-tests/cover/test_image_transform.py
          python-tests/cover/test_templates.py
          python-tests/cover/test_render.py

      - name: Compile modified core
        run: python -m compileall -q python/src

      - name: Remove one-shot implementation files
        shell: bash
        run: |
          rm -f scripts/apply_publisher_core.py
          rm -f .github/implementation/publisher-core-*.b64
          rm -f .github/workflows/apply-publisher-core.yml

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement publisher cover core"
          git push origin HEAD:agent/publisher-back-isbn-image-transform
