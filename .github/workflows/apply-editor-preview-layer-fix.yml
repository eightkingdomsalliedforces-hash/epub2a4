name: Apply editor preview layering fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-editor-preview-layer-fix.yml
      - desktop/tests/test_cover_controller.py
      - python/src/epub_a4_word_desktop/cover/controller.py

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
      - name: Remove editable elements from raster editor preview
        shell: python
        run: |
          from pathlib import Path

          path = Path("python/src/epub_a4_word_desktop/cover/controller.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          worker_indexes = [
              index
              for index, line in enumerate(lines)
              if line.strip() == "worker = PreviewWorker("
          ]
          if len(worker_indexes) != 1:
              raise SystemExit(f"expected one preview worker, found {worker_indexes}")
          worker_index = worker_indexes[0]
          project_indexes = [
              index
              for index in range(worker_index, min(len(lines), worker_index + 10))
              if lines[index].strip() == "self.project_json,"
          ]
          if len(project_indexes) != 1:
              raise SystemExit(f"expected one preview project line, found {project_indexes}")
          raster_setup = [
              "        project = self._require_project()\n",
              "        raster_project = replace(\n",
              "            project,\n",
              "            elements=tuple(\n",
              "                element\n",
              "                for element in project.elements\n",
              "                if element.kind\n",
              "                not in {\n",
              "                    ElementKind.IMAGE,\n",
              "                    ElementKind.TEXT,\n",
              "                    ElementKind.BARCODE_PLACEHOLDER,\n",
              "                }\n",
              "            ),\n",
              "        )\n",
          ]
          lines[worker_index:worker_index] = raster_setup
          project_index = project_indexes[0] + len(raster_setup)
          lines[project_index] = "            dumps_project(raster_project),\n"
          path.write_text("".join(lines), encoding="utf-8")
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/src/epub_a4_word_desktop/cover/controller.py
          git commit -m "fix: prevent duplicate editor preview layers"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
