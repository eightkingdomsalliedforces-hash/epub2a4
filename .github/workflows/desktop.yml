name: Apply and verify desktop compatibility fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/patches/svg-logo-compat.patch"
      - ".github/scripts/apply_desktop_compat.py"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
          fetch-depth: 0
      - name: Apply compatibility changes
        run: |
          git apply --check .github/patches/svg-logo-compat.patch
          git apply .github/patches/svg-logo-compat.patch
          python .github/scripts/apply_desktop_compat.py
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"
      - name: Verify SVG and new desktop feature paths
        run: >-
          python -m pytest
          python-tests/cover/test_publisher_logo_render.py
          desktop/tests/test_svg_logo.py
          desktop/tests/test_publisher_metadata_panel.py
          desktop/tests/test_publisher_logo_dialog.py
          desktop/tests/test_publisher_logo_embedding.py
          desktop/tests/test_converter_crop_controls.py
          desktop/tests/test_layout_preview.py
          -q
      - name: Verify ISBN creation from ISBN-13
        run: python -m pytest desktop/tests/test_publisher_workflow.py::test_controller_apply_isbn_updates_metadata_and_template_barcode -q --tb=short
      - name: Verify ISBN-10 conversion
        run: python -m pytest desktop/tests/test_publisher_workflow.py::test_controller_converts_isbn10_to_ean13_for_barcode -q --tb=short
      - name: Verify moved barcode geometry
        run: python -m pytest desktop/tests/test_publisher_workflow.py::test_controller_isbn_sync_preserves_moved_barcode_geometry -q --tb=short
      - name: Capture publisher logo slot failure
        shell: bash
        run: |
          set +e
          python -m pytest desktop/tests/test_publisher_workflow.py::test_publisher_logo_image_uses_contain_without_cropping -vv --tb=long --junitxml=publisher-logo-slot.xml > publisher-logo-slot.log 2>&1
          code=$?
          echo "$code" > publisher-logo-slot.exit
          cat publisher-logo-slot.log
          exit 0
      - name: Upload publisher logo slot diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: publisher-logo-slot-diagnostics
          path: |
            publisher-logo-slot.log
            publisher-logo-slot.xml
            publisher-logo-slot.exit
          if-no-files-found: error
      - name: Require publisher logo slot test
        run: test "$(cat publisher-logo-slot.exit)" = "0"
      - name: Verify publisher canvas and inspector paths
        run: >-
          python -m pytest
          desktop/tests/test_publisher_workflow.py::test_canvas_creates_interactive_barcode_item
          desktop/tests/test_publisher_workflow.py::test_inspector_exposes_scale_slider_and_transform_shortcuts
          desktop/tests/test_publisher_workflow.py::test_candidate_card_explains_recommended_and_corresponding_isbn
          desktop/tests/test_publisher_workflow.py::test_unrelated_isbn10_is_not_labelled_as_same_edition
          -q --tb=short
      - name: Verify legacy template option compatibility
        run: python -m pytest desktop/tests/test_user_reported_cover_regressions.py -q --tb=short
      - name: Verify canvas reload lifetime
        run: python -m pytest desktop/tests/test_cover_canvas.py -q --tb=short
      - name: Run all shared tests
        run: python -m pytest python-tests -q
      - name: Run all desktop tests
        run: python -m pytest desktop/tests -q
      - name: Compile and verify structure
        run: |
          python -m compileall -q python/src app/src/main/python
          python scripts/verify_project.py
      - name: Commit verified implementation and restore normal CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 159d02747e4c6b45878db046b94ee6800eed848f:.github/workflows/desktop.yml > .github/workflows/desktop.yml
          git rm .github/patches/svg-logo-compat.patch
          git rm .github/patches/desktop-regression-fixes.patch
          git rm .github/workflows/apply-svg-logo-compat.yml
          git rm .github/scripts/apply_desktop_compat.py
          git add -A
          git commit -m "fix: complete desktop publisher template and crop guides"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
