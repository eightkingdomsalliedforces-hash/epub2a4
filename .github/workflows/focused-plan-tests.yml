name: Focused cover search and B6 tests

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/focused-plan-tests.yml"
      - "python/src/epub_a4_word/**"
      - "python/src/epub_a4_word_desktop/conversion/**"
      - "python-tests/test_b6_on_a5_*.py"
      - "python-tests/cover/search/**"
      - "python-tests/fixtures/search/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test,desktop]"

      - name: Test B6 mode contract
        run: python -m pytest python-tests/test_b6_on_a5_mode.py -q

      - name: Test B6 geometry
        run: python -m pytest python-tests/test_b6_on_a5_geometry.py -q

      - name: Capture B6 DOCX output
        id: b6_docx
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest python-tests/test_b6_on_a5_docx.py -vv --tb=long > b6-docx.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload B6 DOCX traceback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b6-docx-traceback
          path: b6-docx.log
          if-no-files-found: error
          retention-days: 7

      - name: Require B6 DOCX output
        if: always()
        run: test "${{ steps.b6_docx.outputs.exit_code }}" = "0"

      - name: Test cover search contracts
        run: python -m pytest python-tests/cover/search/test_contracts.py -q

      - name: Test public book search
        run: python -m pytest python-tests/cover/search/test_public_search.py -q
