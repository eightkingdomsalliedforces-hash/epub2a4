name: Desktop PySide6 tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cross-platform-cover-tool
    paths:
      - "python/**"
      - "desktop/**"
      - "python-tests/**"
      - "app/src/main/python/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "BUILD_STATUS.md"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches:
      - main
    paths:
      - "python/**"
      - "desktop/**"
      - "python-tests/**"
      - "app/src/main/python/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "BUILD_STATUS.md"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  desktop-tests:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install shared project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Install desktop dependencies
        run: >-
          python -m pip install
          "PySide6==6.11.1"
          "pytest-qt>=4.4,<5"
          "keyring==25.7.0"
          "platformdirs==4.10.1"

      - name: Verify shared and desktop dependencies
        run: >-
          python -c "import pypdf, PySide6, PySide6.QtWidgets, pytestqt, keyring, platformdirs;
          print('pypdf', pypdf.__version__);
          print('PySide6', PySide6.__version__);
          print('platformdirs', platformdirs.__version__)"

      - name: Run shared Python tests
        run: python -m pytest python-tests -q --junitxml=core-test-results.xml

      - name: Run desktop tests
        run: python -m pytest desktop/tests -q --junitxml=desktop-test-results.xml

      - name: Run desktop offscreen smoke
        run: python scripts/desktop_smoke.py --offscreen

      - name: Compile Python sources
        run: python -m compileall -q python/src app/src/main/python

      - name: Verify project structure
        run: python scripts/verify_project.py

      - name: Write desktop Part 3 test report
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import platform
          import xml.etree.ElementTree as ET
          import PySide6
          import keyring
          import platformdirs
          import pytestqt

          def summary(path):
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              return {
                  key: sum(int(suite.attrib.get(key, "0")) for suite in suites)
                  for key in ("tests", "failures", "errors", "skipped")
              }

          core = summary("core-test-results.xml")
          desktop = summary("desktop-test-results.xml")
          total = core["tests"] + desktop["tests"]
          report = f"""# Desktop PySide6 Tasks 8–10 test results

          - Commit: `${{{{ github.sha }}}}`
          - Runner: Ubuntu / Python {platform.python_version()}
          - PySide6: {PySide6.__version__}
          - pytest-qt: {getattr(pytestqt, '__version__', 'installed')}
          - keyring: {getattr(keyring, '__version__', '25.7.0')}
          - platformdirs: {platformdirs.__version__}

          ## Automated gates

          - Shared Python tests: {core['tests']} tests, {core['failures']} failures, {core['errors']} errors, {core['skipped']} skipped
          - Desktop tests: {desktop['tests']} tests, {desktop['failures']} failures, {desktop['errors']} errors, {desktop['skipped']} skipped
          - Combined tests: {total}
          - `scripts/desktop_smoke.py --offscreen`: PASS
          - `compileall`: PASS
          - `scripts/verify_project.py`: PASS
          - Matrix: Ubuntu, Windows, macOS / Python 3.13

          ## Limitations

          - Qt is tested with the offscreen platform in CI; visual appearance on physical displays still needs manual review.
          - Native file dialogs are not interactively exercised in headless CI.
          - PDF is the print reference; Word and LibreOffice can differ slightly for floating text boxes and substituted fonts.
          - Android cover UI, online image search, installers, signing, notarization, and update delivery are outside this completed desktop scope.
          """
          Path("desktop-part3-test-results.md").write_text(report, "utf-8")
          PY

      - name: Package verified desktop Tasks 8–10 source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git archive --format=zip \
            --output=epub2a4-desktop-pyside6-part3-tasks8-10.zip \
            HEAD
          sha256sum epub2a4-desktop-pyside6-part3-tasks8-10.zip \
            > epub2a4-desktop-pyside6-part3-tasks8-10.zip.sha256
          unzip -t epub2a4-desktop-pyside6-part3-tasks8-10.zip

      - name: Upload verified desktop Part 3 source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: epub2a4-desktop-pyside6-part3-source
          path: |
            epub2a4-desktop-pyside6-part3-tasks8-10.zip
            epub2a4-desktop-pyside6-part3-tasks8-10.zip.sha256
            desktop-part3-test-results.md
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports-${{ matrix.os }}
          path: |
            core-test-results.xml
            desktop-test-results.xml
          if-no-files-found: ignore
