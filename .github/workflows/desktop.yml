name: Desktop PySide6 tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cross-platform-cover-tool
    paths:
      - "python/**"
      - "desktop/**"
      - "python-tests/**"
      - "app/src/main/python/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches:
      - main
    paths:
      - "python/**"
      - "desktop/**"
      - "python-tests/**"
      - "app/src/main/python/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  desktop-tests:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install shared project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Install desktop bootstrap dependencies
        run: >-
          python -m pip install
          "PySide6==6.11.1"
          "pytest-qt>=4.4,<5"
          "keyring==25.7.0"
          "platformdirs==4.10.1"

      - name: Verify shared and desktop dependencies
        run: >-
          python -c "import pypdf, PySide6, PySide6.QtWidgets, pytestqt, keyring, platformdirs;
          print('pypdf', pypdf.__version__);
          print('PySide6', PySide6.__version__);
          print('platformdirs', platformdirs.__version__)"

      - name: Run shared Python tests
        run: python -m pytest python-tests -q --junitxml=core-test-results.xml

      - name: Run desktop tests
        if: ${{ hashFiles('desktop/tests/**/*.py') != '' }}
        run: python -m pytest desktop/tests -q --junitxml=desktop-test-results.xml

      - name: Compile Python sources
        run: python -m compileall -q python/src app/src/main/python

      - name: Verify project structure
        run: python scripts/verify_project.py

      - name: Package verified Part 1 source
        if: runner.os == 'Linux'
        run: |
          git archive --format=zip \
            --output=epub2a4-desktop-pyside6-part1-tasks1-3.zip \
            HEAD
          sha256sum epub2a4-desktop-pyside6-part1-tasks1-3.zip \
            > epub2a4-desktop-pyside6-part1-tasks1-3.zip.sha256
          unzip -t epub2a4-desktop-pyside6-part1-tasks1-3.zip

      - name: Upload verified Part 1 source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: epub2a4-desktop-pyside6-part1-source
          path: |
            epub2a4-desktop-pyside6-part1-tasks1-3.zip
            epub2a4-desktop-pyside6-part1-tasks1-3.zip.sha256
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports-${{ matrix.os }}
          path: |
            core-test-results.xml
            desktop-test-results.xml
          if-no-files-found: ignore
