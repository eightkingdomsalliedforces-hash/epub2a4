name: Desktop PySide6 tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cross-platform-cover-tool
    paths:
      - "python/**"
      - "desktop/**"
      - "python-tests/**"
      - "app/src/main/python/**"
      - "scripts/**"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - "python/**"
      - "desktop/**"
      - "python-tests/**"
      - "app/src/main/python/**"
      - "scripts/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  desktop-tests:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and desktop test dependencies
        run: python -m pip install -e ".[desktop,test]"

      - name: Verify desktop dependencies
        run: >-
          python -c "import PySide6, PySide6.QtWidgets, pytestqt, keyring, platformdirs;
          print('PySide6', PySide6.__version__);
          print('platformdirs', platformdirs.__version__)"

      - name: Run shared Python tests
        run: python -m pytest python-tests -q --junitxml=core-test-results.xml

      - name: Run desktop tests
        if: ${{ hashFiles('desktop/tests/**/*.py') != '' }}
        run: python -m pytest desktop/tests -q --junitxml=desktop-test-results.xml

      - name: Compile Python sources
        run: python -m compileall -q python/src app/src/main/python

      - name: Verify project structure
        run: python scripts/verify_project.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports-${{ matrix.os }}
          path: |
            core-test-results.xml
            desktop-test-results.xml
          if-no-files-found: ignore
