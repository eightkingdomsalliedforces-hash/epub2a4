name: Apply reference back-cover patch

on:
  push:
    branches:
      - fix/reference-back-cover-isbn-clarity
    paths:
      - .github/implementation/apply-reference-back-isbn.py
      - .github/workflows/apply-reference-back-isbn.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python .github/implementation/apply-reference-back-isbn.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: match reference back cover and clarify ISBN choices"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
