name: Apply shared cover renderer fixes

on:
  push:
    branches:
      - fix/reference-back-cover-isbn-clarity
    paths:
      - .github/workflows/apply-shared-cover-renderer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
      - name: Patch shared renderer
        shell: python
        run: |
          import base64
          from pathlib import Path

          barcode_b64 = ""

          path = Path("python/src/epub_a4_word/cover/render.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          fonts_index = lines.index("from .fonts import resolve_font")
          lines[fonts_index:fonts_index] = [
              "from .barcode_layout import BarcodeTextAnchor, build_barcode_layout",
          ]
          isbn_index = lines.index(
              "from .isbn import encode_ean13_modules, encode_ean_addon_modules, normalize_isbn"
          )
          lines[isbn_index] = "from .isbn import normalize_isbn"
          print_index = lines.index("from .print_plan import PrintMark, PrintPage")
          lines[print_index + 1 : print_index + 1] = [
              "from .typography import font_candidates",
          ]

          font_start = lines.index("    font = resolve_font(")
          font_end = lines.index("    )", font_start)
          lines[font_start : font_end + 1] = [
              "    families = font_candidates(",
              '        str(content.get("font_role", "default")),',
              '        content.get("font_families", content.get("font_family", "sans-serif")),',
              "    )",
              "    font = resolve_font(",
              "        families[0],",
              '        content.get("font_path") if isinstance(content.get("font_path"), str) else None,',
              "        size_px,",
              "        families[1:],",
              "    )",
          ]

          barcode_start = lines.index("def _prepare_barcode(element: CoverElement, size: tuple[int, int], dpi: int) -> Image.Image:")
          clip_start = lines.index("def _clip_layer(", barcode_start)
          barcode = base64.b64decode(barcode_b64).decode("utf-8").splitlines()
          lines[barcode_start:clip_start] = barcode + [""]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/src/epub_a4_word/cover/render.py
          git commit -m "fix: share publisher font and barcode rendering"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
