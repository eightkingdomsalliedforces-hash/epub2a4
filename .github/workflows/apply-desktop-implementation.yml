name: Apply desktop implementation

on:
  push:
    branches:
      - fix/reference-back-cover-isbn-clarity
    paths:
      - ".github/patches/**"
      - ".github/workflows/apply-desktop-implementation.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/desktop-current.part* | tr -d '\n' | base64 -d | gzip -d > /tmp/desktop-current.patch
          test "$(sha256sum /tmp/desktop-current.patch | cut -d' ' -f1)" = "1e025e167ceedba627c40317f9f2d0ee12e7c13a6616a42b7d1c86419a0a1e0a"
          git apply --check /tmp/desktop-current.patch
          git apply /tmp/desktop-current.patch

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run shared tests
        env:
          PYTHONPATH: .:python/src
        run: |
          pytest -q python-tests/cover
          pytest -q python-tests/core python-tests/test_*.py

      - name: Run desktop tests
        env:
          PYTHONPATH: .:python/src
          QT_QPA_PLATFORM: offscreen
        run: pytest -q desktop/tests

      - name: Compile and verify project
        env:
          PYTHONPATH: .:python/src
        run: |
          python -m compileall -q python/src
          python scripts/verify_project.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patches
          rm -f docs/superpowers/plans/.tree-base-test docs/superpowers/plans/.tree-base-test-2 docs/superpowers/plans/.tree-base-test-3
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add desktop publisher spine logos and crop guides"
          git push origin "HEAD:${GITHUB_REF_NAME}"
