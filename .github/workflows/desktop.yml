name: Diagnose desktop compatibility apply

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/patches/svg-logo-compat.patch"
      - ".github/scripts/apply_desktop_compat.py"

permissions:
  contents: read

jobs:
  diagnose-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
          fetch-depth: 0

      - name: Capture compatibility apply diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "=== SVG patch check ==="
            git apply --check .github/patches/svg-logo-compat.patch
            svg_check=$?
            echo "svg_check=$svg_check"
            if [ "$svg_check" = "0" ]; then
              echo "=== SVG patch apply ==="
              git apply .github/patches/svg-logo-compat.patch
              svg_apply=$?
            else
              svg_apply=99
            fi
            echo "svg_apply=$svg_apply"
            echo "=== Compatibility script ==="
            python .github/scripts/apply_desktop_compat.py
            script_code=$?
            echo "script_code=$script_code"
            echo "=== Worktree diff ==="
            git diff --stat
            git diff --check
          } > desktop-compat-apply.log 2>&1
          cat desktop-compat-apply.log
          exit 0

      - name: Upload apply diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: desktop-compat-apply-diagnostics
          path: desktop-compat-apply.log
          if-no-files-found: error
