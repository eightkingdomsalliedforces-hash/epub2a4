name: Apply publisher desktop implementation

on:
  push:
    branches:
      - agent/publisher-back-isbn-image-transform
    paths:
      - ".github/implementation/publisher-desktop-*.b64"
      - ".github/workflows/apply-publisher-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publisher-back-isbn-image-transform
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Apply, test, and publish desktop implementation
        shell: bash
        run: |
          set +e
          {
            cat .github/implementation/publisher-desktop-*.b64 | base64 --decode > scripts/apply_publisher_desktop.py
            python scripts/apply_publisher_desktop.py
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install -e ".[test]"
            python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"
            python -m pytest -q \
              desktop/tests/test_publisher_workflow.py \
              desktop/tests/test_cover_page.py \
              desktop/tests/test_cover_canvas.py \
              desktop/tests/test_cover_search_free_sources.py
            python -m compileall -q python/src desktop/tests
          } > publisher-desktop-result.log 2>&1
          status=$?
          cat publisher-desktop-result.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            cp publisher-desktop-result.log .github/implementation/publisher-desktop-result.log
            git add .github/implementation/publisher-desktop-result.log
            git commit -m "chore: record publisher desktop patch failure" || true
            git push origin HEAD:agent/publisher-back-isbn-image-transform
            exit "$status"
          fi

          rm -f scripts/apply_publisher_desktop.py publisher-desktop-result.log
          rm -f .github/implementation/publisher-desktop-*.b64
          rm -f .github/implementation/publisher-desktop-result.log
          rm -f .github/workflows/apply-publisher-desktop.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: add ISBN and image transform desktop controls"
          git push origin HEAD:agent/publisher-back-isbn-image-transform
