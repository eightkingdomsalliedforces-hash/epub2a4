name: Validate publisher feature

on:
  push:
    branches:
      - agent/publisher-back-isbn-image-transform
    paths:
      - ".github/workflows/validate-publisher-pr.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/publisher-back-isbn-image-transform
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime library
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install project and desktop test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"

      - name: Run all shared Python tests
        run: |
          set -euo pipefail
          python -m pytest python-tests -q --junitxml=core-test-results.xml

      - name: Run all desktop tests
        run: |
          set -euo pipefail
          python -m pytest desktop/tests -q --junitxml=desktop-test-results.xml

      - name: Run desktop offscreen smoke
        run: |
          set -euo pipefail
          python scripts/desktop_smoke.py --offscreen

      - name: Compile and verify project structure
        run: |
          set -euo pipefail
          python -m compileall -q python/src app/src/main/python
          python scripts/verify_project.py

      - name: Record successful validation and remove one-shot workflow
        run: |
          set -euo pipefail
          mkdir -p docs/verification
          cat > docs/verification/2026-07-26-publisher-feature-validation.md <<EOF
          # Publisher feature validation

          Validated on GitHub Actions using Ubuntu and Python 3.13.

          Commands completed successfully:

          - `python -m pytest python-tests -q`
          - `python -m pytest desktop/tests -q`
          - `python scripts/desktop_smoke.py --offscreen`
          - `python -m compileall -q python/src app/src/main/python`
          - `python scripts/verify_project.py`

          Source commit before the validation record: `${GITHUB_SHA}`.
          EOF
          rm -f .github/workflows/validate-publisher-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: record publisher feature validation"
          git push origin HEAD:agent/publisher-back-isbn-image-transform
