name: Apply editor preview layering fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-editor-preview-layer-fix.yml
      - desktop/tests/test_cover_controller.py
      - python/src/epub_a4_word_desktop/cover/controller.py

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
      - name: Remove editable elements from raster editor preview
        shell: python
        run: |
          from pathlib import Path

          path = Path("python/src/epub_a4_word_desktop/cover/controller.py")
          text = path.read_text(encoding="utf-8")
          worker_marker = "        worker = PreviewWorker(\n"
          project_marker = "            self.project_json,\n"
          if text.count(worker_marker) != 1:
              raise SystemExit("preview worker marker was not found exactly once")
          if text.count(project_marker) != 1:
              raise SystemExit("preview project marker was not found exactly once")
          raster_setup = (
              "        project = self._require_project()\n"
              "        raster_project = replace(\n"
              "            project,\n"
              "            elements=tuple(\n"
              "                element\n"
              "                for element in project.elements\n"
              "                if element.kind\n"
              "                not in {\n"
              "                    ElementKind.IMAGE,\n"
              "                    ElementKind.TEXT,\n"
              "                    ElementKind.BARCODE_PLACEHOLDER,\n"
              "                }\n"
              "            ),\n"
              "        )\n"
          )
          text = text.replace(worker_marker, raster_setup + worker_marker, 1)
          text = text.replace(
              project_marker,
              "            dumps_project(raster_project),\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/src/epub_a4_word_desktop/cover/controller.py
          git commit -m "fix: prevent duplicate editor preview layers"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
