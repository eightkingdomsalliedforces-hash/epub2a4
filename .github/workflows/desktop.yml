name: Apply and verify publisher change Logo search

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/scripts/apply_publisher_change.py"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
          fetch-depth: 0
      - name: Apply publisher change fix
        run: |
          python .github/scripts/apply_publisher_change.py
          git diff --check
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"
      - name: Verify publisher change behavior
        run: python -m pytest desktop/tests/test_publisher_change_prompt.py -q --tb=short
      - name: Run all shared tests
        run: python -m pytest python-tests -q
      - name: Run all desktop tests
        run: python -m pytest desktop/tests -q
      - name: Compile and verify structure
        run: |
          python -m compileall -q python/src app/src/main/python
          python scripts/verify_project.py
      - name: Commit verified fix and restore normal CI
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 43ce3f86d0d941ab5ed32b3a3b9ca8bfeabc52a3:.github/workflows/desktop.yml > .github/workflows/desktop.yml
          git rm -f --ignore-unmatch .github/patches/publisher-change-search.patch
          git rm -f --ignore-unmatch .github/scripts/apply_publisher_change.py
          git add -A
          git status --short
          git commit -m "fix: search replacement logo when publisher changes"
          git fetch origin fix/reference-back-cover-isbn-clarity
          git rebase origin/fix/reference-back-cover-isbn-clarity
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
