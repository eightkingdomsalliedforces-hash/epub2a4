name: Apply publisher interaction fixes

on:
  push:
    branches:
      - agent/publisher-back-isbn-image-transform
    paths:
      - ".github/implementation/apply-publisher-interactions.py"
      - ".github/workflows/apply-publisher-interactions.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: python/src:app/src/main/python
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/publisher-back-isbn-image-transform
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply production patch
        run: |
          set -euo pipefail
          python .github/implementation/apply-publisher-interactions.py

      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libegl1
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"

      - name: Run focused core and desktop tests
        run: |
          set -euo pipefail
          python -m pytest -q python-tests/cover/test_isbn.py python-tests/cover/test_publisher_back_template.py python-tests/cover/test_image_transform.py
          python -m pytest -q desktop/tests/test_publisher_workflow.py
          python -m compileall -q python/src app/src/main/python

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          rm -f .github/implementation/apply-publisher-interactions.py
          rm -f .github/workflows/apply-publisher-interactions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve publisher barcode editing"
          git pull --rebase origin agent/publisher-back-isbn-image-transform
          git push origin HEAD:agent/publisher-back-isbn-image-transform
