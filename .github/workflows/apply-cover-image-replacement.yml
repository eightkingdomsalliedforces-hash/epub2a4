name: Apply cover image replacement fix

on:
  push:
    branches:
      - fix/reference-back-cover-isbn-clarity
    paths:
      - .github/workflows/apply-cover-image-replacement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
      - name: Patch controller
        shell: python
        run: |
          from pathlib import Path

          path = Path("python/src/epub_a4_word_desktop/cover/controller.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          method_index = lines.index("    def add_downloaded_images(")
          helper = [
              "    @staticmethod",
              "    def _without_replaced_cover_images(",
              "        elements: list[CoverElement],",
              "        replacement_regions: set[Region],",
              "    ) -> list[CoverElement]:",
              "        replace_spread = Region.SPREAD in replacement_regions",
              "        return [",
              "            element",
              "            for element in elements",
              "            if not (",
              "                element.kind is ElementKind.IMAGE",
              "                and (",
              "                    replace_spread",
              "                    or element.region is Region.SPREAD",
              "                    or element.region in replacement_regions",
              "                )",
              "            )",
              "        ]",
              "",
          ]
          lines[method_index:method_index] = helper
          method_index += len(helper)

          elements_index = lines.index("        elements = list(project.elements)", method_index)
          normalized_index = lines.index(
              "        normalized = {CandidateCategory(key): value for key, value in selections.items()}",
              elements_index,
          )
          replacement = [
              "        added: list[str] = []",
              "        order = (",
              "            CandidateCategory.BACK,",
              "            CandidateCategory.SPINE,",
              "            CandidateCategory.FRONT,",
              "        )",
              "        normalized = {CandidateCategory(key): value for key, value in selections.items()}",
              "        replacement_regions = {",
              "            self._region_for_category(category)",
              "            for category in normalized",
              "            if category in order",
              "        }",
              "        elements = self._without_replaced_cover_images(",
              "            list(project.elements), replacement_regions",
              "        )",
              "        highest_z = max((element.z_index for element in elements), default=0)",
          ]
          lines[elements_index : normalized_index + 1] = replacement

          spread_index = lines.index("    def add_composed_spread(self, source_path: Path | str) -> str:")
          highest_index = lines.index(
              "        highest_z = max((element.z_index for element in project.elements), default=0)",
              spread_index,
          )
          lines[highest_index : highest_index + 1] = [
              "        retained = self._without_replaced_cover_images(",
              "            list(project.elements), {Region.SPREAD}",
              "        )",
              "        highest_z = max((element.z_index for element in retained), default=0)",
          ]
          dumps_index = lines.index(
              "            dumps_project(replace(project, elements=project.elements + (element,))),",
              spread_index,
          )
          lines[dumps_index] = (
              "            dumps_project(replace(project, elements=tuple(retained) + (element,))),"
          )

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/src/epub_a4_word_desktop/cover/controller.py
          git commit -m "fix: replace overlapping cover images"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
