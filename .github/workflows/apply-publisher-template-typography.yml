name: Apply publisher template typography

on:
  push:
    branches:
      - fix/reference-back-cover-isbn-clarity
    paths:
      - .github/workflows/apply-publisher-template-typography.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-back-cover-isbn-clarity
      - name: Patch publisher template and tests
        shell: python
        run: |
          import base64
          from pathlib import Path

          publisher_b64 = ""
          test_b64 = ""

          path = Path("python/src/epub_a4_word/cover/templates.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          info_id = lines.index('        "back-publisher-info",')
          lines[info_id + 1 : info_id + 1] = [
              '        "back-publisher-heading",',
              '        "back-publisher-details",',
          ]

          text_start = lines.index("def text_element(")
          signature_end = lines.index(") -> CoverElement:", text_start)
          z_index_line = lines.index("    z_index: int = 10,", text_start, signature_end)
          lines[z_index_line + 1 : z_index_line + 1] = [
              '    font_role: str = "default",',
              '    font_family: str = "sans-serif",',
              '    vertical_align: str = "center",',
              '    line_spacing: float = 1.15,',
          ]
          family_line = lines.index('            "font_family": "sans-serif",', text_start)
          lines[family_line : family_line + 1] = [
              '            "font_family": font_family,',
              '            "font_role": font_role,',
          ]
          spacing_line = lines.index('            "line_spacing": 1.15,', family_line)
          lines[spacing_line] = '            "line_spacing": line_spacing,'
          align_line = lines.index('            "align": align,', family_line)
          lines[align_line + 1 : align_line + 1] = [
              '            "vertical_align": vertical_align,',
          ]

          publisher_start = lines.index("def _publisher_back_matter(")
          builders_start = lines.index("_BUILDERS = {", publisher_start)
          publisher = base64.b64decode(publisher_b64).decode("utf-8").splitlines()
          lines[publisher_start:builders_start] = publisher + [""]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          Path("python-tests/cover/test_publisher_back_template.py").write_bytes(
              base64.b64decode(test_b64)
          )

          desktop = Path("desktop/tests/test_publisher_workflow.py")
          desktop_text = desktop.read_text(encoding="utf-8")
          desktop_text = desktop_text.replace(
              'assert updated.elements_by_id["back-isbn-label"].content["text"] == "ISBN 9780306406157"',
              'assert updated.elements_by_id["back-isbn-label"].content["text"] == "ISBN 978-030-640-615-7"',
          )
          desktop.write_text(desktop_text, encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/src/epub_a4_word/cover/templates.py python-tests/cover/test_publisher_back_template.py desktop/tests/test_publisher_workflow.py
          git commit -m "fix: match rounded publisher information block"
          git push origin HEAD:fix/reference-back-cover-isbn-clarity
