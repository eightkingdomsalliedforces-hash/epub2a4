name: Apply agent implementation patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-agent-patch.yml"
      - ".agent-bootstrap/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply staged implementation patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .agent-bootstrap/chunk-00 ]]; then
            echo "Staging chunks already removed; nothing to apply."
            exit 0
          fi
          cat .agent-bootstrap/chunk-* > /tmp/implementation.patch.xz.b64
          base64 --decode /tmp/implementation.patch.xz.b64 > /tmp/implementation.patch.xz
          xz --decompress --stdout /tmp/implementation.patch.xz > /tmp/implementation.patch
          echo "907c1cbed1e31cc691c35173fc033ed32d6dc2c5c60390ff544b088ea973a986  /tmp/implementation.patch" | sha256sum --check -
          git apply --index /tmp/implementation.patch
          rm -rf .agent-bootstrap
          rm -f .github/workflows/bootstrap-agent-patch.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add free multilingual cover lookup and body-only conversion"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
