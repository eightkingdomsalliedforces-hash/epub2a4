name: Desktop PySide6 tests

on:
  workflow_dispatch:
  push:
    branches:
      - fix/reference-back-cover-isbn-clarity
    paths:
      - ".github/patches/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/patches/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  apply-desktop-implementation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .:python/src
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and validate patch
        id: reconstruct
        continue-on-error: true
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/reconstruct.log) 2>&1
          ls -l .github/patches/desktop-current.part*
          wc -c .github/patches/desktop-current.part*
          cat .github/patches/desktop-current.part* | tr -d '\n' > /tmp/desktop-current.b64
          echo "base64 characters: $(wc -c < /tmp/desktop-current.b64)"
          base64 -d /tmp/desktop-current.b64 > /tmp/desktop-current.patch.gz
          decode_status=$?
          echo "base64 status: ${decode_status}"
          echo "gzip bytes: $(wc -c < /tmp/desktop-current.patch.gz)"
          gzip -t /tmp/desktop-current.patch.gz
          gzip_status=$?
          echo "gzip status: ${gzip_status}"
          if [ "${gzip_status}" -eq 0 ]; then
            gzip -dc /tmp/desktop-current.patch.gz > /tmp/desktop-current.patch
            actual_sha="$(sha256sum /tmp/desktop-current.patch | cut -d' ' -f1)"
            echo "patch SHA256: ${actual_sha}"
            echo "expected SHA256: 1e025e167ceedba627c40317f9f2d0ee12e7c13a6616a42b7d1c86419a0a1e0a"
            git apply --check /tmp/desktop-current.patch
            apply_status=$?
            echo "git apply check status: ${apply_status}"
          else
            actual_sha=""
            apply_status=1
          fi
          if [ "${decode_status}" -ne 0 ] || [ "${gzip_status}" -ne 0 ] || [ "${actual_sha}" != "1e025e167ceedba627c40317f9f2d0ee12e7c13a6616a42b7d1c86419a0a1e0a" ] || [ "${apply_status}" -ne 0 ]; then
            exit 1
          fi
          git apply /tmp/desktop-current.patch

      - name: Upload reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-reconstruction-diagnostics
          path: |
            /tmp/reconstruct.log
            /tmp/desktop-current.b64
            /tmp/desktop-current.patch.gz
            /tmp/desktop-current.patch
          if-no-files-found: warn

      - name: Stop after reconstruction failure
        if: steps.reconstruct.outcome != 'success'
        run: exit 1

      - name: Install Linux Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip install "PySide6==6.11.1" "pytest-qt>=4.4,<5" "keyring==25.7.0" "platformdirs==4.10.1"

      - name: Run shared tests
        run: |
          python -m pytest python-tests/cover -q
          python -m pytest python-tests/core python-tests/test_*.py -q

      - name: Run desktop tests
        run: python -m pytest desktop/tests -q

      - name: Compile and verify project
        run: |
          python -m compileall -q python/src app/src/main/python
          python scripts/verify_project.py
          python scripts/desktop_smoke.py --offscreen

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patches
          rm -f docs/superpowers/plans/.tree-base-test docs/superpowers/plans/.tree-base-test-2 docs/superpowers/plans/.tree-base-test-3
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add desktop publisher spine logos and crop guides"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
